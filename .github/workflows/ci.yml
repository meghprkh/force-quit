name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    # gnome-extensions is a 105 KB native binary that gnome-shell ships next to
    # the shell itself, so installing the package drags in gjs/libmozjs,
    # mutter, GTK4, gnome-control-center and the wallpapers - ~30 MB a packing
    # step never uses, and apt cannot install one half of a package. Extract
    # the binary and install only the libraries it links that the runner lacks.
    - name: Install gnome-extensions and gettext
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends gettext \
          libgnome-autoar-0-0 libjson-glib-1.0-0 libsoup-3.0-0
        cd "$RUNNER_TEMP"
        apt-get download gnome-shell
        dpkg -x gnome-shell_*.deb gnome-shell-root
        # fail here, not three steps later, if a library is missing
        ./gnome-shell-root/usr/bin/gnome-extensions --version
        echo "$RUNNER_TEMP/gnome-shell-root/usr/bin" >> "$GITHUB_PATH"

    - name: Use Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm install --no-audit --no-fund
    - run: npm run lint

    - name: Build the extension zip
      run: make pack

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: '3.14'
        enable-cache: true

    # EGO's review linter, fed the zip above: a bare checkout trips EGO-P-005/006
    # on files that never ship (README, LICENSE). Advisory: continue-on-error,
    # so it reports without blocking. tree-sitter >= 0.26 segfaults this shexli
    # on our files - bump the two together.
    - name: shexli
      continue-on-error: true
      run: uvx --with 'tree-sitter<0.26' shexli --format text fq@megh.shell-extension.zip

    - uses: actions/upload-artifact@v7
      with:
        name: force-quit
        path: fq@megh.shell-extension.zip
